name: JAY Math Design QA
concurrency:
  group: jay-math-qa-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - jay/math-design-20261026
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test bilingual pages and mathematical reading
        env:
          JAY_STRICT: 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/math-ui-server.log 2>&1 &
          sleep 2
          node tests/jay-math-site.test.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jay-math-design-browser-screenshots
          path: jay-math-qa-shots/
          if-no-files-found: ignore
