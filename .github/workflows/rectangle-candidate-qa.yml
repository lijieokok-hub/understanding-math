name: Rectangle candidate QA
on:
  push:
    branches:
      - feature/rectangle-story-20261102
      - feature/rectangle-3d-visuals-20261102
      - feature/rectangle-mobile-reading-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rectangle-candidate-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/math-ui-server.log 2>&1 &
          echo $! >/tmp/math-ui-server.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/math-ui-server.log
          exit 1
      - name: Existing site regression
        env:
          JAY_STRICT: 'true'
        run: node tests/jay-math-site.test.mjs
      - name: Verify bilingual film resources and playback
        if: always()
        run: |
          python3 tests/rectangle-video-static.test.py
          node tests/rectangle-video-browser.test.mjs
      - name: Bilingual rectangle story and responsive interactions
        if: always()
        run: node tests/rectangle-story.test.mjs
      - name: Verify 3D mathematics, projection and static fallback
        if: always()
        run: |
          node tests/rectangle-spatial-geometry.test.mjs
          node tests/rectangle-spatial.test.mjs
      - name: Verify balancing example and reading links
        if: always()
        run: node tests/rectangle-balance.test.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rectangle-candidate-browser-screenshots
          path: |
            jay-math-qa-shots/
            rectangle-qa-shots/
            rectangle-spatial-shots/
          if-no-files-found: ignore
